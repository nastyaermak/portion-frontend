<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Порція — рецепти</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header></header>

  <h1>Рецепти</h1>
  <p>Каталог доступний усім. Щоб додавати свої рецепти, увійдіть в акаунт.</p>
  <div id="recipes">Завантаження…</div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    renderHeader();

    function recipeCard(r) {
      const n = r.nutrition_per_serving;
      return $('<div class="recipe">').append(
        $('<h2>').text(r.title),
        $('<div class="meta">').text(r.category.name + ' · ' + r.cuisine.name + ' · ' +
          r.cook_time_min + ' хв · автор: ' + r.author.display_name),
        $('<div>').text(n.kcal + ' ккал · Б ' + n.protein + ' · Ж ' + n.fat + ' · В ' + n.carbs),
      );
    }

    api('/recipes')
      .then(function (data) {
        const list = $('#recipes').empty();
        data.results.forEach((r) => list.append(recipeCard(r)));
      })
      .catch(function () {
        $('#recipes').html('<p class="error">Не вдалося отримати дані. Перевірте, що бекенд запущено на 127.0.0.1:8000.</p>');
      });
  </script>
</body>
</html>
